# Single node image reused across all stages.
# npm cache persisted across pipelines to avoid re-downloading packages.

image: node:20-slim

stages:
  - validate
  - package
  - deploy

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .npm/
    - node_modules/

# Run tests and build in a single job to avoid pulling the image twice.
validate:
  stage: validate
  script:
    - npm ci --prefer-offline
    - npm test
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "dev"

# ---------------------------------------------------------------------------
# Package — build the production image and push it to the GitLab registry
# ---------------------------------------------------------------------------
docker:
  stage: package
  needs: [validate]
  tags: [docker]
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAG="stable"
      else
        TAG="latest"
      fi
      docker build \
        --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA \
        --tag $CI_REGISTRY_IMAGE:$TAG \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        .
      docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
      docker push $CI_REGISTRY_IMAGE:$TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Deploy — recreate the bom-uploader container on proxmox2 via Dockhand
#
# Only this container is updated, not the whole "valor" stack it belongs to:
# a stack redeploy with pull would also update vaultwarden, redis and the
# Atlassian apps whenever their upstream tags moved. batch-update pulls the
# image (Dockhand holds the GitLab registry credentials) and recreates the
# container with its existing settings.
#
# DOCKHAND_API_TOKEN is a masked CI/CD variable (Settings → CI/CD → Variables).
# ---------------------------------------------------------------------------
deploy:production:
  stage: deploy
  needs: [docker]
  tags: [docker]
  image: alpine:3.20
  variables:
    DOCKHAND_URL: https://docker.mray190.com
    DOCKHAND_ENV_ID: "2"          # proxmox2
    CONTAINER_NAME: bom-uploader
  environment:
    name: production
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eu
      AUTH="Authorization: Bearer $DOCKHAND_API_TOKEN"

      CONTAINER_ID=$(curl -sSf -H "$AUTH" "$DOCKHAND_URL/api/containers?env=$DOCKHAND_ENV_ID" \
        | jq -r --arg name "$CONTAINER_NAME" '.[] | select(.name == $name) | .id')
      if [ -z "$CONTAINER_ID" ]; then
        echo "No container named $CONTAINER_NAME in Dockhand environment $DOCKHAND_ENV_ID" >&2
        exit 1
      fi

      echo "Updating $CONTAINER_NAME ($CONTAINER_ID) to the newly pushed image"
      RESULT=$(curl -sSf -X POST "$DOCKHAND_URL/api/containers/batch-update?env=$DOCKHAND_ENV_ID" \
        -H "$AUTH" \
        -H "Accept: application/json" \
        -H "Content-Type: application/json" \
        -d "{\"containerIds\": [\"$CONTAINER_ID\"]}")
      echo "$RESULT" | jq .

      # The call returns 200 even when the update itself failed, so check the result.
      echo "$RESULT" | jq -e '.success == true and all(.results[]; .success == true)' > /dev/null
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
