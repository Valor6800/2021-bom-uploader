# Single node image reused across all stages.
# npm cache persisted across pipelines to avoid re-downloading packages.

image: node:20-slim

stages:
  - validate
  - package
  - deploy

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .npm/
    - node_modules/

# Run tests and build in a single job to avoid pulling the image twice.
validate:
  stage: validate
  script:
    - npm ci --prefer-offline
    - npm test
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Package — build the production image and push it to the GitLab registry
# ---------------------------------------------------------------------------
docker:
  stage: package
  needs: [validate]
  tags: [docker]
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAG="stable"
      else
        TAG="latest"
      fi
      docker build \
        --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA \
        --tag $CI_REGISTRY_IMAGE:$TAG \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        .
      docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
      docker push $CI_REGISTRY_IMAGE:$TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Deploy — recreate the bom-uploader container on docker2 via Portainer
# ---------------------------------------------------------------------------
deploy:production:
  stage: deploy
  needs: [docker]
  tags: [docker]
  image: alpine:3.20
  variables:
    PORTAINER_URL: https://docker.mray190.com
    PORTAINER_API_KEY: $PORTAINER_API_KEY
    ENDPOINT_ID: "5"
    CONTAINER_NAME: bom-uploader
  environment:
    name: production
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      CONTAINER_ID=$(curl -sk -H "X-API-Key: $PORTAINER_API_KEY" \
        "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/containers/json" | \
        tr -d '\000-\037' | \
        jq -r --arg name "$CONTAINER_NAME" '.[] | select(.Names[] == "/"+$name) | .Id')
      echo "Recreating $CONTAINER_NAME ($CONTAINER_ID)"
      curl -sfk -X POST \
        -H "X-API-Key: $PORTAINER_API_KEY" \
        -H "Content-Type: application/json" \
        -d '{"PullImage":true}' \
        "$PORTAINER_URL/api/docker/$ENDPOINT_ID/containers/$CONTAINER_ID/recreate" > /dev/null
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
